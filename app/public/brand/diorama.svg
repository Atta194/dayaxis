<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-label="Daily life command center">
  <rect width="900" height="640" fill="#F6F3EA"/>
  <circle cx="760" cy="90" r="150" fill="#57BFA9" opacity="0.12"/>
  <circle cx="90" cy="560" r="130" fill="#E9B44C" opacity="0.14"/>
  <!-- desk -->
  <rect x="120" y="430" width="660" height="34" rx="12" fill="#C8965F"/>
  <rect x="160" y="464" width="28" height="120" rx="6" fill="#B98A55"/>
  <rect x="712" y="464" width="28" height="120" rx="6" fill="#B98A55"/>
  <!-- progress ring hovering -->
  <circle cx="450" cy="255" r="120" fill="none" stroke="#1E7A6B" stroke-width="18" opacity="0.35"/>
  <circle cx="450" cy="255" r="120" fill="none" stroke="#1E7A6B" stroke-width="18"
    stroke-dasharray="560 194" stroke-linecap="round" transform="rotate(-90 450 255)"/>
  <path d="M400 255 L440 295 L508 222" fill="none" stroke="#E8705F" stroke-width="30"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- calendar -->
  <rect x="160" y="290" width="130" height="140" rx="14" fill="#FFFDF6" stroke="#E4DED0" stroke-width="3"/>
  <rect x="160" y="290" width="130" height="34" rx="14" fill="#2E9686"/>
  <circle cx="185" cy="330" r="4" fill="#F6F3EA"/>
  <circle cx="265" cy="330" r="4" fill="#F6F3EA"/>
  <rect x="180" y="345" width="34" height="26" rx="5" fill="#E8705F"/>
  <rect x="222" y="345" width="34" height="26" rx="5" fill="#57BFA9"/>
  <rect x="180" y="380" width="34" height="26" rx="5" fill="#E4DED0"/>
  <rect x="222" y="380" width="34" height="26" rx="5" fill="#E9B44C"/>
  <!-- plate -->
  <circle cx="585" cy="360" r="62" fill="#FFFDF6" stroke="#E4DED0" stroke-width="3"/>
  <circle cx="565" cy="345" r="26" fill="#4C9E6F"/>
  <circle cx="605" cy="370" r="20" fill="#E8705F" opacity="0.85"/>
  <circle cx="585" cy="385" r="14" fill="#E9B44C"/>
  <!-- dumbbell -->
  <rect x="700" y="300" width="16" height="60" rx="8" fill="#24312D"/>
  <rect x="722" y="300" width="16" height="60" rx="8" fill="#24312D"/>
  <rect x="712" y="312" width="16" height="36" rx="7" fill="#E4DED0"/>
  <!-- medicine organizer -->
  <rect x="250" y="470" width="150" height="66" rx="12" fill="#FFFDF6" stroke="#E4DED0" stroke-width="3"/>
  <rect x="272" y="488" width="24" height="22" rx="5" fill="#57BFA9"/>
  <rect x="302" y="488" width="24" height="22" rx="5" fill="#E8705F"/>
  <rect x="332" y="488" width="24" height="22" rx="5" fill="#E9B44C"/>
  <rect x="362" y="488" width="24" height="22" rx="5" fill="#4C9E6F"/>
  <!-- toolbox -->
  <rect x="560" y="470" width="120" height="66" rx="12" fill="#B8723E"/>
  <rect x="560" y="470" width="120" height="22" rx="9" fill="#A86433"/>
  <rect x="600" y="488" width="40" height="10" rx="5" fill="#F6F3EA"/>
  <!-- envelope -->
  <rect x="720" y="470" width="120" height="70" rx="10" fill="#FFFDF6" stroke="#E4DED0" stroke-width="3"/>
  <path d="M720 480 L780 522 L840 480" fill="none" stroke="#E8705F" stroke-width="5" stroke-linejoin="round"/>
  <!-- alarm clock -->
  <circle cx="470" cy="500" r="24" fill="#FFFDF6" stroke="#E4DED0" stroke-width="3"/>
  <rect x="462" y="468" width="6" height="14" rx="3" fill="#24312D"/>
  <rect x="472" y="466" width="6" height="14" rx="3" fill="#24312D"/>
  <path d="M470 500 L470 488 M470 500 L479 504" stroke="#24312D" stroke-width="3" stroke-linecap="round"/>
</svg>